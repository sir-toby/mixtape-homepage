# Sveltia CMS – https://sveltiacms.app (Decap-compatible configuration)
# Every save is a commit to `main`; GitHub Actions then rebuilds and deploys the site.
backend:
  name: github
  repo: sir-toby/mixtape-homepage
  branch: main
  commit_messages:
    create: 'CMS: {{collection}} „{{slug}}“ angelegt'
    update: 'CMS: {{collection}} „{{slug}}“ geändert'
    delete: 'CMS: {{collection}} „{{slug}}“ gelöscht'
    uploadMedia: 'CMS: Bild {{path}} hochgeladen'
    deleteMedia: 'CMS: Bild {{path}} gelöscht'

site_url: https://sir-toby.github.io/mixtape-homepage/
publish_mode: simple

# Images inserted into Markdown text are served as-is from public/uploads.
media_folder: /public/uploads
public_folder: /uploads

output:
  omit_empty_optional_fields: true

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: events
    label: Termine
    label_singular: Termin
    description: Auftritte. Vergangene Termine wandern automatisch in den Rückblick.
    folder: src/content/events
    extension: md
    format: frontmatter
    create: true
    slug: '{{title}}'
    # Path from the project root: Astro's image() helper resolves it and optimises the image.
    media_folder: /src/assets/events
    public_folder: /src/assets/events
    summary: "{{date | date('DD.MM.YYYY')}} · {{title}}"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    fields:
      - { label: Titel, name: title, widget: string }
      - label: Datum
        name: date
        widget: datetime
        time_format: false
        date_format: DD.MM.YYYY
        format: YYYY-MM-DD
        picker_utc: true
      - label: Beginn
        name: start
        widget: string
        required: false
        hint: 'Uhrzeit, z. B. 19:30. Leer lassen = ganztägig.'
        pattern: ['^\d{2}:\d{2}$', 'Bitte im Format HH:MM angeben, z. B. 19:30']
      - label: Ende
        name: end
        widget: string
        required: false
        pattern: ['^\d{2}:\d{2}$', 'Bitte im Format HH:MM angeben, z. B. 21:00']
      - { label: Ort, name: location, widget: string, required: false, hint: 'z. B. Kirche St. Jakob' }
      - { label: Adresse, name: address, widget: string, required: false, hint: 'z. B. Jakobsplatz 1, Nürnberg' }
      - { label: Bild / Plakat, name: image, widget: image, required: false }
      - { label: Bildbeschreibung, name: imageAlt, widget: string, required: false, hint: 'Was ist auf dem Bild zu sehen? (für Screenreader)' }
      - label: Links
        name: links
        widget: list
        required: false
        hint: 'Zusätzliche Buttons, z. B. Tickets oder Veranstalter-Seite.'
        fields:
          - { label: Beschriftung, name: label, widget: string }
          - { label: URL, name: url, widget: string }
      - { label: Private / geschlossene Veranstaltung, name: private, widget: boolean, default: false, required: false }
      - { label: Entwurf (nicht anzeigen), name: draft, widget: boolean, default: false, required: false }
      - { label: Beschreibung, name: body, widget: markdown, required: false }

  - name: members
    label: Mitglieder
    label_singular: Mitglied
    folder: src/content/members
    extension: md
    format: frontmatter
    create: true
    slug: '{{name}}'
    identifier_field: name
    media_folder: /src/assets/members
    public_folder: /src/assets/members
    summary: '{{name}} · {{voice}}'
    sortable_fields: [order, name]
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Stimme, name: voice, widget: string, hint: 'z. B. Sopran, Tenor & Beatbox' }
      - { label: Foto, name: photo, widget: image }
      - { label: Fotobeschreibung, name: photoAlt, widget: string, required: false }
      - { label: Eigene Website, name: website, widget: string, required: false }
      - { label: Ehemaliges Mitglied, name: former, widget: boolean, default: false, required: false }
      - { label: Reihenfolge, name: order, widget: number, value_type: int, default: 10 }
      - { label: Text, name: body, widget: markdown }

  - name: pages
    label: Seiten
    files:
      - name: home
        label: Startseite
        file: src/content/pages/home.md
        fields:
          - { label: Seitentitel, name: title, widget: string }
          - { label: Beschreibung (Suchmaschinen), name: description, widget: text, required: false }
          - { label: Zeile über dem Slogan, name: kicker, widget: string, required: false, hint: 'z. B. Vocalband · A cappella' }
          - { label: Slogan (große Überschrift), name: tagline, widget: string, hint: 'Erscheint auch im Footer. Das Wort „Spaß“ wird orange hervorgehoben.' }
          - { label: Satz unter dem Slogan, name: lead, widget: string, required: false }
          - { label: Überschrift Termine, name: eventsHeading, widget: string }
          - { label: Begrüßung (Überschrift), name: heading, widget: string }
          - { label: Begrüßungstext, name: body, widget: markdown }
          - { label: Bildunterschrift am Foto, name: photoCaption, widget: string, required: false }
          - { label: Überschrift Band, name: bandHeading, widget: string }
          - { label: Untertitel Band, name: bandIntro, widget: string, required: false }
          - { label: Überschrift Buchung, name: bookingHeading, widget: string }
          - { label: Buchungs-Text, name: bookingText, widget: text }
          - { label: Buchungs-Button, name: bookingButton, widget: string }
          - { label: Überschrift Newsletter, name: newsletterHeading, widget: string, hint: 'Der Text darunter kommt von der Seite „Newsletter“.' }
      - name: termine
        label: Termine (Seitentexte)
        file: src/content/pages/termine.md
        fields:
          - { label: Seitentitel, name: title, widget: string }
          - { label: Beschreibung (Suchmaschinen), name: description, widget: text, required: false }
          - { label: Label über dem Titel, name: label, widget: string, required: false }
          - { label: Einleitung im Seitenkopf, name: intro, widget: text, required: false }
          - { label: Überschrift kommende Termine, name: upcomingHeading, widget: string }
          - { label: Überschrift bisherige Auftritte, name: pastHeading, widget: string }
          - { label: Text, wenn keine Termine anstehen, name: emptyText, widget: string }
          - { label: 'Kalender-Abo: fetter Anfang', name: calendarTitle, widget: string }
          - { label: 'Kalender-Abo: Text', name: calendarText, widget: text }
          - { label: 'Newsletter-Kasten: fetter Anfang', name: newsletterTitle, widget: string }
          - { label: 'Newsletter-Kasten: Text', name: newsletterText, widget: text }
          - { label: Buchungshinweis unter dem Rückblick, name: bookingNote, widget: string, hint: 'Danach folgt automatisch die E-Mail-Adresse.' }
          - { label: 'Private Termine: Hinweis', name: privateText, widget: string }
          - { label: 'Private Termine: Link-Text', name: privateLink, widget: string, hint: 'Öffnet eine E-Mail an die Band.' }
      - name: wer-wir-sind
        label: Über uns
        file: src/content/pages/wer-wir-sind.md
        fields:
          - { label: Seitentitel, name: title, widget: string }
          - { label: Beschreibung (Suchmaschinen), name: description, widget: text, required: false }
          - { label: Label über dem Titel, name: label, widget: string, required: false, hint: 'Handschrift-Zeile im Seitenkopf, z. B. Liner Notes' }
          - { label: Einleitung im Seitenkopf, name: intro, widget: string, required: false }
          - { label: Text, name: body, widget: markdown }
          - { label: Überschrift Mitglieder, name: membersHeading, widget: string }
          - { label: Überschrift Besetzung, name: lineupHeading, widget: string }
          - { label: Überschrift Ehemalige, name: formerHeading, widget: string }
          - { label: Bildunterschrift Gruppenfoto (Ehemalige), name: oldPhotoCaption, widget: string, required: false }
          - { label: Überschrift unten (vor den Buttons), name: ctaHeading, widget: string }
          - label: Besetzung
            name: lineup
            widget: list
            summary: '{{period}}'
            fields:
              - { label: Zeitraum, name: period, widget: string }
              - { label: Namen, name: names, widget: string }
      - name: newsletter
        label: Newsletter
        file: src/content/pages/newsletter.md
        fields:
          - { label: Seitentitel, name: title, widget: string }
          - { label: Beschreibung (Suchmaschinen), name: description, widget: text, required: false }
          - { label: Label über dem Titel, name: label, widget: string, required: false }
          - { label: Einleitung im Seitenkopf, name: intro, widget: string, required: false }
          - { label: Text, name: body, widget: markdown, hint: 'Steht auch auf der Startseite beim Newsletter.' }
          - { label: Hinweis unter dem Formular, name: hint, widget: text, required: false }
      - name: impressum
        label: Impressum
        file: src/content/pages/impressum.md
        fields:
          - { label: Seitentitel, name: title, widget: string }
          - { label: Label über dem Titel, name: label, widget: string, required: false }
          - { label: Text, name: body, widget: markdown }
      - name: datenschutzerklaerung
        label: Datenschutzerklärung
        file: src/content/pages/datenschutzerklaerung.md
        fields:
          - { label: Seitentitel, name: title, widget: string }
          - { label: Label über dem Titel, name: label, widget: string, required: false }
          - { label: Text, name: body, widget: markdown }

      - name: fehlerseite
        label: Fehlerseite (404)
        file: src/content/pages/fehlerseite.md
        fields:
          - { label: Seitentitel (Browser-Tab), name: title, widget: string }
          - { label: Überschrift, name: heading, widget: string }
          - { label: Text, name: intro, widget: string, required: false }

  - name: settings
    label: Einstellungen
    files:
      - name: settings
        label: Kontakt & Links
        file: src/data/settings.json
        fields:
          - { label: Name, name: siteName, widget: string }
          - { label: E-Mail, name: email, widget: string }
          - { label: Instagram-URL, name: instagram, widget: string }
          - { label: Newsletter-Formular (CleverReach-URL), name: newsletterFormAction, widget: string }
          - { label: Genres (Laufband), name: genres, widget: list }
